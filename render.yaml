services:
  - type: web
    name: radiant-volta-api
    env: node
    buildCommand: cd backend && npm install && npm run prisma:generate && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radiant-volta-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: radiant-volta-db
    databaseName: radiant_volta_expenses
    user: radiant_user
    plan: free
